<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="helmetGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#c7d2fe;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.8" />
    </radialGradient>
    <linearGradient id="visorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="reflectionGradient" cx="30%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Sombra del casco -->
  <ellipse cx="105" cy="180" rx="45" ry="10" fill="#000000" opacity="0.3"/>
  
  <!-- Casco principal -->
  <circle cx="100" cy="100" r="70" fill="url(#helmetGradient)" stroke="#c7d2fe" stroke-width="3"/>
  
  <!-- Visor -->
  <circle cx="100" cy="95" r="55" fill="url(#visorGradient)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Reflejo en el visor -->
  <ellipse cx="80" cy="75" rx="20" ry="25" fill="url(#reflectionGradient)"/>
  
  <!-- Detalles técnicos del casco -->
  <rect x="85" y="45" width="30" height="8" rx="4" fill="#c7d2fe" opacity="0.8"/>
  <rect x="88" y="47" width="24" height="4" rx="2" fill="#00d4ff" opacity="0.6"/>
  
  <!-- Conexiones laterales -->
  <circle cx="50" cy="120" r="8" fill="#c7d2fe" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="150" cy="120" r="8" fill="#c7d2fe" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Tubos de conexión -->
  <rect x="42" y="115" width="16" height="10" rx="5" fill="#c7d2fe" opacity="0.8"/>
  <rect x="142" y="115" width="16" height="10" rx="5" fill="#c7d2fe" opacity="0.8"/>
  
  <!-- Indicadores LED -->
  <circle cx="75" cy="55" r="3" fill="#00ff88">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="125" cy="55" r="3" fill="#ff0040">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ventilación -->
  <g opacity="0.6">
    <rect x="70" y="160" width="60" height="2" rx="1" fill="#00d4ff"/>
    <rect x="75" y="165" width="50" height="2" rx="1" fill="#00d4ff"/>
    <rect x="80" y="170" width="40" height="2" rx="1" fill="#00d4ff"/>
  </g>
  
  <!-- Brillo exterior -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  
  <!-- Campo de estrellas reflejadas -->
  <g opacity="0.4">
    <circle cx="90" cy="85" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="105" r="0.8" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="110" r="1.2" fill="#ffffff">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>