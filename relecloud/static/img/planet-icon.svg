<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="planetGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="ringGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.8" />
      <stop offset="80%" style="stop-color:#c7d2fe;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Anillos del planeta -->
  <ellipse cx="100" cy="100" rx="120" ry="30" fill="none" stroke="url(#ringGradient)" stroke-width="8" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="100" cy="100" rx="140" ry="35" fill="none" stroke="url(#ringGradient)" stroke-width="4" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="25s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Planeta principal -->
  <circle cx="100" cy="100" r="50" fill="url(#planetGradient)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Características de la superficie -->
  <ellipse cx="85" cy="90" rx="15" ry="8" fill="#16213e" opacity="0.7"/>
  <ellipse cx="110" cy="105" rx="12" ry="6" fill="#16213e" opacity="0.5"/>
  <ellipse cx="95" cy="115" rx="8" ry="4" fill="#16213e" opacity="0.6"/>
  
  <!-- Brillo atmosférico -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="52" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Estrellas de fondo -->
  <g opacity="0.8">
    <circle cx="20" cy="40" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="60" r="1.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="160" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="170" r="1.2" fill="#ffffff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="30" r="0.8" fill="#ffffff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>