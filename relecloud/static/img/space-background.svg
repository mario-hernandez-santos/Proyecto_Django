<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="80%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="nebulaGradient" cx="30%" cy="70%" r="60%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Fondo del espacio -->
  <rect width="1920" height="1080" fill="url(#spaceGradient)"/>
  
  <!-- Nebulosa -->
  <ellipse cx="1400" cy="800" rx="600" ry="400" fill="url(#nebulaGradient)" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 1400 800;360 1400 800" dur="100s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Campo de estrellas -->
  <g id="stars">
    <!-- Estrellas grandes -->
    <circle cx="200" cy="150" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="200" r="2.5" fill="#00d4ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1600" cy="300" r="2" fill="#9d4edd">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Estrellas medianas -->
    <circle cx="400" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="1200" cy="120" r="1.5" fill="#c7d2fe" opacity="0.9"/>
    <circle cx="300" cy="400" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="1700" cy="150" r="1.5" fill="#00d4ff" opacity="0.8"/>
    <circle cx="100" cy="600" r="1.5" fill="#9d4edd" opacity="0.6"/>
    
    <!-- Estrellas pequeñas -->
    <circle cx="150" cy="250" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="350" cy="180" r="1" fill="#c7d2fe" opacity="0.7"/>
    <circle cx="600" cy="350" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="900" cy="100" r="1" fill="#00d4ff" opacity="0.8"/>
    <circle cx="1100" cy="450" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="1400" cy="250" r="1" fill="#9d4edd" opacity="0.7"/>
    <circle cx="1800" cy="500" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="500" cy="700" r="1" fill="#c7d2fe" opacity="0.8"/>
    <circle cx="1300" cy="600" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="50" cy="800" r="1" fill="#00d4ff" opacity="0.7"/>
    
    <!-- Más estrellas dispersas -->
    <circle cx="750" cy="50" r="0.8" fill="#ffffff" opacity="0.4"/>
    <circle cx="450" cy="300" r="0.8" fill="#c7d2fe" opacity="0.5"/>
    <circle cx="1050" cy="180" r="0.8" fill="#ffffff" opacity="0.6"/>
    <circle cx="1450" cy="80" r="0.8" fill="#9d4edd" opacity="0.4"/>
    <circle cx="250" cy="500" r="0.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="850" cy="400" r="0.8" fill="#00d4ff" opacity="0.6"/>
    <circle cx="1250" cy="350" r="0.8" fill="#ffffff" opacity="0.4"/>
    <circle cx="1650" cy="700" r="0.8" fill="#c7d2fe" opacity="0.5"/>
    <circle cx="150" cy="900" r="0.8" fill="#ffffff" opacity="0.6"/>
    <circle cx="950" cy="800" r="0.8" fill="#9d4edd" opacity="0.4"/>
    
    <!-- Estrellas muy pequeñas para crear densidad -->
    <circle cx="320" cy="120" r="0.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="720" cy="280" r="0.5" fill="#c7d2fe" opacity="0.4"/>
    <circle cx="1120" cy="320" r="0.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="1520" cy="180" r="0.5" fill="#00d4ff" opacity="0.4"/>
    <circle cx="180" cy="380" r="0.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="580" cy="480" r="0.5" fill="#9d4edd" opacity="0.4"/>
    <circle cx="980" cy="220" r="0.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="1380" cy="520" r="0.5" fill="#c7d2fe" opacity="0.4"/>
    <circle cx="1780" cy="380" r="0.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="80" cy="720" r="0.5" fill="#00d4ff" opacity="0.4"/>
  </g>
  
  <!-- Galaxia lejana -->
  <ellipse cx="200" cy="200" rx="50" ry="20" fill="#9d4edd" opacity="0.3" transform="rotate(45 200 200)">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Planeta lejano -->
  <circle cx="1700" cy="200" r="15" fill="#0f3460" opacity="0.6"/>
  <ellipse cx="1700" cy="200" rx="25" ry="5" fill="none" stroke="#c7d2fe" stroke-width="1" opacity="0.4"/>
  
  <!-- Cometa -->
  <g transform="translate(1000, 300)">
    <circle cx="0" cy="0" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="-20" cy="0" rx="30" ry="2" fill="#c7d2fe" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-15" cy="-1" rx="20" ry="1" fill="#ffffff" opacity="0.4"/>
    <ellipse cx="-15" cy="1" rx="20" ry="1" fill="#ffffff" opacity="0.4"/>
    <animateTransform attributeName="transform" type="translate" values="1000,300;300,700;1000,300" dur="30s" repeatCount="indefinite"/>
  </g>
  
  <!-- Más partículas de polvo estelar -->
  <g opacity="0.2">
    <rect x="0" y="540" width="1920" height="1" fill="url(#nebulaGradient)"/>
    <rect x="0" y="640" width="1920" height="1" fill="url(#nebulaGradient)"/>
    <rect x="0" y="440" width="1920" height="1" fill="url(#nebulaGradient)"/>
  </g>
</svg>