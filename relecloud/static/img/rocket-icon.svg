<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d4edd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0040;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cuerpo del cohete -->
  <ellipse cx="100" cy="120" rx="25" ry="60" fill="url(#rocketGradient)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Punta del cohete -->
  <polygon points="100,40 85,80 115,80" fill="url(#rocketGradient)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Ventana -->
  <circle cx="100" cy="90" r="12" fill="#0a0a0f" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="100" cy="90" r="8" fill="#00d4ff" opacity="0.3"/>
  
  <!-- Aletas -->
  <polygon points="75,160 85,180 75,180" fill="url(#rocketGradient)" stroke="#00d4ff" stroke-width="2"/>
  <polygon points="125,160 115,180 125,180" fill="url(#rocketGradient)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Llamas -->
  <ellipse cx="100" cy="190" rx="8" ry="15" fill="url(#flameGradient)">
    <animateTransform attributeName="transform" type="scale" values="1,1;1.2,1.5;1,1" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="90" cy="185" rx="5" ry="10" fill="url(#flameGradient)">
    <animateTransform attributeName="transform" type="scale" values="1,1;1.3,1.2;1,1" dur="0.7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="110" cy="185" rx="5" ry="10" fill="url(#flameGradient)">
    <animateTransform attributeName="transform" type="scale" values="1,1;1.3,1.2;1,1" dur="0.6s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Estrellas de fondo -->
  <circle cx="30" cy="30" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="50" r="1.5" fill="#ffffff">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="170" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="160" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>